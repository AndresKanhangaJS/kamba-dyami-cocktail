# Atalho para desenvolvimento local: `docker compose -f docker-compose.dev.yml up`
# Sobe apenas a app em modo dev, sem o Nginx (que só corre em produção).

services:
  app:
    build:
      context: .
      dockerfile: .docker/Dockerfile.dev
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_APP_URL=http://localhost:3001
    command: npm run dev
    networks:
      - kamba-network

networks:
  kamba-network:
    driver: bridge
